name: Tracker & Alerte Mail

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track-and-mail:
    runs-on: ubuntu-24.04
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Executer le releve
        env:
          EA_SESSION: ${{ secrets.EA_SESSION }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
        run: python -u tracker_github.py

      - name: Sauvegarder les donnees
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/adherents.csv data/departements.csv data/last_alert.json
          git add data/top15_departements.png || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: snapshot et maj alerte [skip ci]" && git push)
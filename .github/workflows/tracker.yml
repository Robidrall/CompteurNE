name: Tracker & Alerte Mail

on:
  workflow_dispatch: # Déclenché exclusivement par le ping API externe (cron-job.org) ou manuellement

permissions:
  contents: write

jobs:
  track-and-mail:
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Installer Playwright et ses dépendances système
        run: playwright install --with-deps chromium
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Exécuter le relevé
        env:
          EA_SESSION: ${{ secrets.EA_SESSION }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python -u tracker_github.py

      - name: Sauvegarder les données
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/adherents.csv data/last_alert.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: snapshot et maj alerte [skip ci]" && git push)
